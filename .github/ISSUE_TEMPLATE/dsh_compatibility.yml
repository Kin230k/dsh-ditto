name: DSH compatibility
description: Ditto fails to install, load, or run on a specific DeepSeek Harness version
labels: ["dsh compatibility"]
body:
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: dsh --version
    validations:
      required: true
  - type: input
    id: ditto
    attributes:
      label: Ditto version
      placeholder: 0.2.0 (from dsh-ditto --version)
    validations:
      required: true
  - type: textarea
    id: boot
    attributes:
      label: Launcher output
      description: If the profile fails to boot, paste the `dsh: plugin tree failed to load: …` line.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `dsh plugin --profile <name> exec dsh-ditto doctor`.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Profile name, OS, Node.js version, whether this worked on an earlier DSH version.
