# dsh-ditto bundle patch.
#
# `dsh plugin --profile <name> add dsh-ditto` installs this package into the profile
# and, because package.json declares `dsh.bundle`, adds it to the profile's bundle
# stack. This layer inserts the Ditto plugin entry into the composed plugin tree.
#
# To change the configuration, override the entry by id from the profile's own
# cordis.patch.yml (a user patch replaces the whole config object, so restate every
# field you keep):
#
#   - id: ditto
#     config:
#       workspaceRoot: /path/to/repo   # anchor for relative paths, state, and Code → Spec
#       stateRoot: .dsh-ditto          # durable state; must stay inside workspaceRoot
#       allowedSourceRoots:            # absolute roots; widens file organisation only
#         - /path/to/repo
#         - C:/Users/name/Desktop/ftp-backup
#       allowedDestinationRoots:
#         - /path/to/repo
#         - C:/Users/name/Desktop/deliveries
#       approval: host                 # host | agent — see docs/SAFETY.md
#       approvalUnavailable: deny      # set agent only if conversational fallback is accepted
#       maxItems: 200
#       resultItems: 25
#       evidenceItems: 20
- insert:
    - id: ditto
      name: 'dsh-ditto/dsh'
      config:
        stateRoot: .dsh-ditto
